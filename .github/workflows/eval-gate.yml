name: RAG eval gate

on:
  push:
  pull_request:

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Retrieval eval gate (blocks the merge on regression)
        run: pytest tests -q
      - name: Scorecard across stages S0 to S5
        run: python run_lab.py
      - name: Publish scorecard to the job summary
        run: cat results/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: results/
